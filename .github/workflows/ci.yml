name: Operix verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: operix
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: operix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operix -d operix"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      FILE_SCAN_MODE: test
      SECURITY_LOG_DIR: storage/security
      DATABASE_URL: postgresql://operix:ci-only-postgres-password@127.0.0.1:5432/operix
      TEST_DATABASE_URL: postgresql://operix:ci-only-postgres-password@127.0.0.1:5432/operix_test
      RESTORE_DATABASE_URL: postgresql://operix:ci-only-postgres-password@127.0.0.1:5432/operix_restore
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-never-use-for-production-00001
      ADMIN_EMAIL: admin@operix.test
      ADMIN_PASSWORD: CI-only-Operix-password-123!
      DEMO_PASSWORD: CI-only-Operix-password-123!
      SEED_DEMO: "1"
      UPLOAD_DIR: storage/uploads
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Prepare isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U operix operix_test
      - name: Explicit type and static checks
        run: npm run typecheck && npm run lint
      - name: Domain and security tests against PostgreSQL
        run: npm test
      - name: NAS deployment contract tests
        run: python3 -m unittest discover -s tests -p 'test_nas_*.py'
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and API verification
        run: npm run test:e2e
        env:
          E2E_START_SERVER: "1"
      - name: PostgreSQL dump and isolated restore verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/recovery
          docker exec ${{ job.services.postgres.id }} pg_dump -U operix -d operix -Fc > test-results/recovery/database.dump
          docker exec ${{ job.services.postgres.id }} createdb -U operix operix_restore
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U operix -d operix_restore --no-owner --exit-on-error < test-results/recovery/database.dump
          node scripts/verify-restore.mjs
          tar -czf test-results/recovery/storage.tar.gz -C storage .
          mkdir test-results/recovery/files
          tar -xzf test-results/recovery/storage.tar.gz -C test-results/recovery/files
          diff -r storage test-results/recovery/files
          rm test-results/recovery/database.dump test-results/recovery/storage.tar.gz
          rm -rf test-results/recovery/files
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operix-verification
          include-hidden-files: true
          path: |
            test-results/e2e-results.json
            test-results/accessibility.json
            test-results/screenshots
            test-results/ui-improve
            test-results/sample-report.pdf
            .data/performance.json
            playwright-report
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create disposable container configuration
        shell: bash
        run: |
          cat > .env <<'ENV'
          APP_URL=http://localhost:3000
          SESSION_SECRET=ci-only-container-secret-not-for-production-000001
          POSTGRES_PASSWORD=ci-only-container-database-password
          ADMIN_EMAIL=admin@operix.test
          ADMIN_PASSWORD=CI-only-container-password-123!
          SEED_DEMO=0
          OPERIX_IMAGE_TAG=ci
          OPERIX_CONTAINER_TEST=1
          FILE_SCAN_MODE=clamav
          SECURITY_LOG_KEY=ci-only-independent-security-signing-key-not-for-production-0002
          ENV
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Wait for virus scanner
        run: docker compose exec -T scanner clamdscan --ping=120:2
      - name: Container health and authentication
        run: |
          curl --fail http://localhost:3000/api/health
          curl --fail -c /tmp/operix-cookies -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' --data '{"email":"admin@operix.test","password":"CI-only-container-password-123!"}' http://localhost:3000/api/auth/login
          curl --fail -b /tmp/operix-cookies http://localhost:3000/api/data/assets
      - name: Container replacement preserves database and attachments
        env:
          OPERIX_CONTAINER_TEST: "1"
        run: |
          node --env-file=.env scripts/verify-container.mjs prepare
          docker compose up -d --force-recreate web worker
          node --env-file=.env scripts/verify-container.mjs verify
      - name: Prepare disposable backup encryption identity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          age-keygen -o /tmp/operix-backup-identity
          echo "BACKUP_AGE_RECIPIENT=$(age-keygen -y /tmp/operix-backup-identity)" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_IDENTITY=/tmp/operix-backup-identity" >> "$GITHUB_ENV"
      - name: Backup and restore scripts recover the expected state
        env:
          OPERIX_CONTAINER_TEST: "1"
        run: |
          bash scripts/backup.sh /tmp/operix-ci-backups
          node --env-file=.env scripts/verify-container.mjs mutate
          for backup_dir in /tmp/operix-ci-backups/operix-*; do
            bash scripts/verify-recovery-failure.sh "$backup_dir"
            CONFIRM_RESTORE=YES bash scripts/restore.sh "$backup_dir"
          done
          node --env-file=.env scripts/verify-container.mjs verify
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Worker failure degrades readiness
        run: |
          docker compose stop worker
          docker compose exec -T db psql -U operix -d operix -c "UPDATE job_runs SET last_success=now()-interval '10 minutes' WHERE id='worker'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = 503
          docker compose start worker
      - name: Export the exact verified application image
        if: >-
          github.repository == 'happyaspic-byte/Operix' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          tested_container=$(docker compose ps -q web)
          test -n "$tested_container"
          tested_image_id=$(docker inspect --format '{{.Image}}' "$tested_container")
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$tested_image_id")" = linux/amd64
          deployment_image="operix:github-${GITHUB_SHA}"
          docker tag "$tested_image_id" "$deployment_image"
          mkdir -p deploy-artifact
          docker save "$deployment_image" | gzip -n > deploy-artifact/operix-image.tar.gz
          test "$(wc -c < deploy-artifact/operix-image.tar.gz)" -le 2000000000
          printf '%s\n' "$tested_image_id" > deploy-artifact/image-id.txt
      - name: Retain tested NAS image for the publisher
        if: >-
          github.repository == 'happyaspic-byte/Operix' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: operix-nas-image
          path: |
            deploy-artifact/image-id.txt
            deploy-artifact/operix-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Stop disposable containers
        if: always()
        run: docker compose down -v
  publish:
    needs: [application, container]
    if: >-
      github.repository == 'happyaspic-byte/Operix' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: operix-nas-image
          path: deploy-artifact
      - name: Load and verify the exact tested image
        id: tested
        shell: bash
        run: |
          set -euo pipefail
          tested_image_id=$(cat deploy-artifact/image-id.txt)
          [[ "$tested_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load --input deploy-artifact/operix-image.tar.gz
          loaded_image="operix:github-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Id}}' "$loaded_image")" = "$tested_image_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$loaded_image")" = linux/amd64
          printf 'image_id=%s\n' "$tested_image_id" >> "$GITHUB_OUTPUT"
      - name: Push tested image to GHCR and verify its digest
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_IMAGE_ID: ${{ steps.tested.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker version --format '{{.Server.APIVersion}}' | python3 -c \
            'import sys; version=tuple(map(int, sys.stdin.read().strip().split("."))); assert version >= (1, 46), "Docker API 1.46+ is required for a single-platform push"'
          registry_tag="ghcr.io/happyaspic-byte/operix:sha-${GITHUB_SHA}"
          docker tag "$TESTED_IMAGE_ID" "$registry_tag"
          docker push --platform linux/amd64 "$registry_tag" | tee /tmp/operix-registry-push.log
          registry_digest=$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          pattern = r'^sha-' + os.environ['GITHUB_SHA'] + r': digest: (sha256:[0-9a-f]{64}) size: [0-9]+\s*$'
          matches = re.findall(pattern, Path('/tmp/operix-registry-push.log').read_text(), re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit('Expected one pushed Operix registry digest')
          print('ghcr.io/happyaspic-byte/operix@' + matches[0])
          PY
          )
          docker pull "$registry_digest"
          test "$(docker image inspect --format '{{.Id}}' "$registry_digest")" = "$TESTED_IMAGE_ID"
          printf 'image=%s\n' "$registry_digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=GHCR image uploaded::Package: https://github.com/users/happyaspic-byte/packages/container/package/operix"
      - name: Wait for public GHCR image
        env:
          DEPLOYMENT_IMAGE: ${{ steps.registry.outputs.image }}
          TESTED_IMAGE_ID: ${{ steps.tested.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_digest="${DEPLOYMENT_IMAGE##*@}"
          public_deadline=$((SECONDS + 300))
          for attempt in $(seq 1 30); do
            if [ "$SECONDS" -ge "$public_deadline" ]; then break; fi
            anonymous_token=$(curl -q --fail --silent --connect-timeout 3 --max-time 5 \
              'https://ghcr.io/token?service=ghcr.io&scope=repository:happyaspic-byte/operix:pull' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null) || anonymous_token=
            if [ -n "$anonymous_token" ] && curl -q --fail --silent --connect-timeout 3 --max-time 5 \
              -H "Authorization: Bearer $anonymous_token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/happyaspic-byte/operix/manifests/$manifest_digest" \
              -o /tmp/operix-public-manifest.json; then
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('/tmp/operix-public-manifest.json').read_text())
          if manifest.get('schemaVersion') != 2 or manifest.get('config', {}).get('digest') != os.environ['TESTED_IMAGE_ID']:
              raise SystemExit('Public GHCR manifest does not match the tested image')
          PY
              echo 'Anonymous pull of the tested image is available.'
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo '::notice title=GHCR public visibility required::Set the operix package visibility to Public at https://github.com/users/happyaspic-byte/packages/container/package/operix . Waiting up to five minutes; the deployment branch remains unchanged.'
            fi
            remaining_wait=$((public_deadline - SECONDS))
            if [ "$remaining_wait" -le 0 ]; then break; fi
            if [ "$remaining_wait" -gt 10 ]; then remaining_wait=10; fi
            sleep "$remaining_wait"
          done
          echo '::error title=GHCR image is not publicly accessible::Set package visibility to Public at https://github.com/users/happyaspic-byte/packages/container/package/operix , then rerun the failed publish job. The deployment branch was not advanced.'
          exit 1
      - name: Publish native Portainer Compose
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          python3 scripts/publish-nas-compose.py --revision "$GITHUB_SHA" \
            --image "$DEPLOYMENT_IMAGE" --template deploy/nas/compose.template.json \
            --run-id "$GITHUB_RUN_ID"
      - name: Remove temporary registry credentials
        if: always()
        run: docker logout ghcr.io
