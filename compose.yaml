name: operix
x-app: &app
  image: operix:${OPERIX_IMAGE_TAG:-local}
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://operix:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/operix
    OPERIX_EMBEDDED: "0"
    UPLOAD_DIR: /app/storage/uploads
  volumes:
    - uploads:/app/storage
  init: true
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: operix
      POSTGRES_USER: operix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operix -d operix"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command:
      [
        "sh",
        "-c",
        "node --import tsx scripts/migrate.ts && node --import tsx scripts/seed.ts",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    ports:
      - "127.0.0.1:${OPERIX_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  database:
  uploads:
